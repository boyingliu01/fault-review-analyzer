[project]
name = "fault-review-analyzer"
version = "0.1.0"
description = "AI驱动的故障复盘分析工具"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Fault Review Analyzer Team"}
]
keywords = ["fault", "analysis", "ai", "llm", "clustering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    "httpx>=0.25.0",
    "openai>=1.0.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "sentence-transformers>=2.2.0",
    "hdbscan>=0.8.0",
    "umap-learn>=0.5.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "jinja2>=3.1.0",
    "loguru>=0.7.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.19.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.6",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "pytest-playwright>=0.4.0",
    "playwright>=1.40.0",
    "syrupy>=4.0.0",
    "faker>=18.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "types-PyYAML>=6.0.0",
    "streamlit>=1.30.0",
    "plotly>=5.0.0",
]
e2e = [
    "pytest>=7.0.0",
    "pytest-playwright>=0.4.0",
    "playwright>=1.40.0",
]

[project.scripts]
fault-analyzer = "src.cli.main:app"
fault-analyzer-api = "src.api.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --ignore=tests/e2e/ui"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore:n_jobs value 1 overridden:UserWarning",
    "ignore:n_neighbors is larger than the dataset:UserWarning",
    "ignore:Spectral initialisation failed:UserWarning",
]
markers = [
    "e2e: end-to-end tests",
    "ui: UI tests requiring browser",
    "slow: slow running tests",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/__init__.py",
    "src/cli/*",
    "src/ui/*",  # UI模块需要端到端测试，不适合单元测试
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 79.9

[tool.ruff]
line-length = 100
target-version = "py310"
force-exclude = true
exclude = [
    "tests/__snapshots__",
    ".qoder",
    ".sprint-state",
    # 根目录一次性调研/演示脚本与 playwright 配置：历史产物，从未被
    # `ruff check src/ tests/` 覆盖。显式逐文件排除（ruff 的 exclude glob
    # 无根目录锚定语义，"/*.py" 会误伤 src/tests，禁止使用）。
    # scripts/ 运维脚本（rerun_*.py 等）保持清洁并持续纳管。
    "debug_recommendations.py",
    "demo_phase1_mock.py",
    "demo_phase2_mock.py",
    "example_feedback.py",
    "example_observability.py",
    "fetch_batch_live.py",
    "fetch_final.py",
    "fetch_final_v2.py",
    "fetch_fixed.py",
    "fetch_more_tasks.py",
    "fetch_with_requests.py",
    "parse_swagger.py",
    "phase2_real_analysis.py",
    "playwright.config.py",
    "run_cli.py",
    "run_explainability_test.py",
    "validate_and_fix.py",
    "validate_api_fields.py",
    # scripts/ 下早期一次性分析/验证脚本（非运维脚本）
    "scripts/run_sample_analysis.py",
    "scripts/parse_standards.py",
    "scripts/analyze_faults.py",
    "scripts/run_sample_parallel.py",
    "scripts/analyze_faults_v2.py",
    "scripts/apply_violation_review.py",
    "scripts/inspect_swagger.py",
    "scripts/run_single_verify.py",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "ARG001", # unused function argument
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "S101", "PTH123"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
# scripts/ 目录无 __init__.py：直接扫描会解析为顶层模块（rerun_conclusions），
# 而 tests/scripts 测试以包形式导入（scripts.rerun_conclusions），两个模块名
# 指向同一文件导致 "Source file found twice" 崩溃。显式包基让 mypy 统一按
# 文件系统路径从 rootdir 推断全限定名（scripts.* 为 namespace 包），消除撞名
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
show_error_codes = true
show_column_numbers = true

[[tool.mypy.overrides]]
module = [
    "hdbscan.*",
    "umap.*",
    "sentence_transformers.*",
    "langchain.*",
    "langchain_openai.*",
    "sklearn.*",
    "plotly.*",
    "pandas",
    "numpy",
    "streamlit.*",
    "shap",
    "matplotlib",
    "matplotlib.*",
    "watchdog.*",
    "fitz",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
# 测试用 AsyncMock/MagicMock 替换 pipeline 私有方法（mock 注入惯用法），
# mypy 的 method-assign 对此误报，测试域内豁免
disable_error_code = ["method-assign"]
