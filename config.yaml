api:
  base_url: "https://dev.iwhalecloud.com"
  api_key: "REDACTED_API_KEY"
  timeout: 30
  retry: 3
  api_path_prefix: "/portal/ai-gateway/devspace/rpc/v3/work-item"

llm:
  provider: "zhipu"
  model: "glm-4"
  api_key: "REDACTED_ZHIPU_KEY"
  temperature: 0.7
  max_tokens: 4096

embedding:
  provider: "volcengine"
  model: "doubao-embedding-text-240715"
  api_key: "REDACTED_LLM_KEY"
  base_url: "https://ark.cn-beijing.volcs.com/api/v3"

clustering:
  algorithm: "hdbscan"
  min_cluster_size: 2
  min_samples: 1
  metric: "cosine"

cache:
  enabled: true
  ttl: 86400
  storage: "sqlite"

rules:
  builtin_enabled: true
  custom_paths:
    - "./data/rules/custom/"

output:
  format: "markdown"
  directory: "./output/"

logging:
  level: "INFO"
