# =============================================================================
# INACTIVE — 本文件当前未生效，仅供参考/备用
# =============================================================================
# 实际生效的质量门禁系统: xp-gate hooks (.git/hooks/pre-commit + pre-push)
# core.hooksPath 指向 .git/hooks，xp-gate 的 pre-commit hook 完全替代了
# pre-commit 框架的 hook 执行流程。
#
# 功能映射 (xp-gate 已覆盖):
#   trailing-whitespace / end-of-file-fixer → 编辑器/CI 层面处理
#   check-yaml / check-json               → ruff 已覆盖 Python 语法检查
#   check-added-large-files               → xp-gate Gate 1 间接覆盖
#   check-merge-conflict                  → 编辑器/Git 原生提示
#   ruff / ruff-format                    → xp-gate Gate 1 (ruff check)
#   mypy                                  → xp-gate Gate 1 (mypy)
#   pytest                                → xp-gate Gate 5 (pytest + coverage)
#
# 未被 xp-gate 覆盖的检查:
#   debug-statements   → Python debug 语句检测 (breakpoint/pdb)
#   detect-secrets     → 密钥泄漏扫描 (需安装: pip install detect-secrets)
#
# 如需重新激活: pre-commit install (会覆盖 xp-gate hook，请谨慎操作)
# =============================================================================
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-json

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: package.lock.json

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.9.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.0.0
          - types-PyYAML
        args: [--ignore-missing-imports]

  - repo: local
    hooks:
      - id: pytest-check
        name: pytest-check
        entry: pytest tests/ -x -q
        language: system
        pass_filenames: false
        always_run: true
