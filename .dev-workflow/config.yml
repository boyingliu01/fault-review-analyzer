# Dev-Workflow 配置文件
# 由 dev-workflow 初始化生成（2026-03-04）

# 质量门禁模式
# strict: 所有文件必须 0 错误 0 警告
# incremental: 新文件必须 0 警告；修改文件告警数必须减少
mode: incremental

# SDD 开发模式
# spec-kit: 完整规格驱动（使用 .speckit/ 目录）
sdd_mode: spec-kit

# 项目信息
project:
  language: python
  type: maintenance
  created_date: "2026-03-04"

# 项目复杂度评估
complexity:
  type: medium
  created_date: "2026-03-04"

# 排除目录和文件
exclude:
  directories:
    - __pycache__
    - .venv
    - venv
    - .mypy_cache
    - .ruff_cache
    - .pytest_cache
    - htmlcov
    - dist
    - build
    - data
  patterns:
    - "*.pyc"
    - "*.pyo"
  files: []

# 质量门禁配置
quality_gate:
  strict:
    all_files:
      errors: 0
      warnings: 0
  incremental:
    new_files:
      errors: 0
      warnings: 0
    modified_files:
      allow_increase: false
      require_decrease: true
      min_decrease: 1
      force_fix_threshold: 5
