# 代码变更分析链路补齐方案

## 目标
补齐从"获取代码diff"到"分析代码diff"到"规范检查"到"基于代码变更聚类"的完整链路。

## 核心改动

### 1. API层 - 代码diff获取
- `CommitInfo` 增加 `diff` 字段
- `APIClient` 增加 `get_code_diffs()` 方法，从研发云获取commit对应的diff内容
- 支持降级：API不可用时，diff为空字符串

### 2. Pipeline集成 - 代码变更分析
- 在 `AnalysisPipeline.run_single()` 中集成 `CodeChangeAnalyzer`
- 新增 `_analyze_code_changes()` 方法
- `PipelineResult` 增加 `code_change_analysis` 字段

### 3. 规范检查 - 基于实际代码
- 重写 `RulesEngine.check()` 使其检查代码diff而非commit message
- 同时保留对commit message的检查作为补充
- `PipelineResult.violations` 填充真实违规数据

### 4. 聚类改造 - 基于代码变更
- `run_clustering()` 的输入文本从纯故障描述改为"故障描述+代码变更分析摘要"
- 当有代码diff数据时，优先使用代码变更特征进行聚类

## 数据流
```
API获取任务 → 获取代码diff → 预处理器(含diff) → CodeChangeAnalyzer分析
→ RulesEngine检查违规 → LLM分析(标签/根因) → 聚类(基于代码变更+文本)
→ 报告生成(含违规信息)
```

## 向后兼容
- 所有改动对无diff数据的场景保持兼容（diff为空时降级到原有文本分析）
- 不破坏现有测试
